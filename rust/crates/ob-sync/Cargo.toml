[package]
name = "ob-sync"
description = "Lock-free hand-off between threads: seqlock-published order books, SPSC record queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ob-core = { path = "../ob-core" }

[target.'cfg(loom)'.dependencies]
# Model checker: explores every thread interleaving and weak-memory outcome of small
# tests. Only compiled with RUSTFLAGS="--cfg loom".
loom = "0.7"

[dev-dependencies]
proptest = "1.12"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "sync"
harness = false

[lints]
workspace = true
