# Coverage-guided fuzzing for the WebSocket codec. Needs nightly:
#   cd rust/crates/ob-net && cargo +nightly fuzz run ws -- -max_total_time=300
[package]
name = "ob-net-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ob-net = { path = ".." }

[workspace]
members = ["."]

[[bin]]
name = "ws"
path = "fuzz_targets/ws.rs"
test = false
doc = false
bench = false
