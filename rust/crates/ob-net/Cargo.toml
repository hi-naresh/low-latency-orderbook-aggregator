[package]
name = "ob-net"
description = "Network layer: a zero-copy WebSocket codec (this step), then TLS and sockets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# OS-level socket tuning and kernel receive timestamps.
ob-os = { path = "../ob-os" }
# SHA-1 is needed once per connection, to check the server's handshake answer
# (RFC 6455 §4.2.2). Tiny, dependency-free; never on the hot path.
sha1_smol = "1"
# TLS 1.3/1.2 in Rust, with the `ring` crypto backend (AES-GCM via AES-NI; builds with
# just a C compiler, unlike aws-lc-rs which needs cmake here). No default features: no
# logging, no unneeded algorithms.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# AES-GCM / ChaCha20-Poly1305 for our record layer: the same implementation
# rustls is configured with here, already in the dependency tree.
ring = "0.17"
# Mozilla's root certificates, compiled in: no dependency on the OS certificate store.
webpki-roots = "1"
# Socket options std doesn't expose (receive buffer size).
socket2 = "0.6"

[dev-dependencies]
proptest = "1.12"
# The live test parses real exchange messages.
ob-core = { path = "../ob-core" }
ob-parse = { path = "../ob-parse" }
# Generates a throwaway certificate for the local TLS test server.
rcgen = "0.14"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Independent WebSocket implementation, used only as a test oracle for frame headers.
tungstenite = { version = "0.30", default-features = false }

[[bench]]
name = "ws"
harness = false

[lints]
workspace = true
